# Doom RPG for the SNES with the SuperFX (GSU-2): the "MARIO" memory map:
# the ROM (2 MB) as 32 KB banks at $00-$3F:8000 and as 64 KB banks at
# $40-$5F. The code runs in bank $40 (the data bank register at $7E, as in
# the plain build); its first half is also bank $00's $8000-$FFFF, where
# the vectors are, so the entry stubs live there. C's constants and data
# are copied from bank $41; then the tables (tools/snes_tables.py, two
# banks), the GSU's program, the resources, the campaign's block
# (tools/snes_rom.py --fx).
# ld65 linker configuration. MEMORY lists the areas (start is the address
# the CPU sees; "file = %O" areas are written to the output in this
# order); SEGMENTS places each assembler/C segment in an area ("load" is
# where it is stored, "run" where it is used: copied there by crt0.s).
# All RAM areas are in bank $7E (bank $00's low 8 KB is the same RAM).
MEMORY {
    # cc65's zero page: the direct page, $00-$EF
    ZP:      start = $0000, size = $00F0, type = rw, define = yes;
    # low RAM, reachable with any data bank ($00, $7E, $80): the NMI's variables
    LORAM:   start = $0200, size = $0E00, type = rw, define = yes;
    RAM:     start = $2000, size = $CF00, type = rw, define = yes;
    # cc65's software stack (4 KB, growing down from $FEFF)
    CSTACK:  start = $EF00, size = $1000, type = rw, define = yes;
    # bank $40 $0000-$7EFF (also $00:8000-$FEFF)
    ROMLO:   start = $0000, size = $7F00, type = ro, fill = yes, fillval = $FF, file = %O;
    # $00:FF00: the reset and NMI entry stubs (bank $00), the header, the vectors
    STUBS:   start = $FF00, size = $00B0, type = ro, fill = yes, fillval = $FF, file = %O;
    HEADER:  start = $FFB0, size = $0030, type = ro, fill = yes, fillval = $00, file = %O;
    VECTORS: start = $FFE0, size = $0020, type = ro, fill = yes, fillval = $FF, file = %O;
    # bank $40 $8000-$FFFF
    ROMHI:   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF, file = %O;
    # bank $41: what is copied into RAM at start-up
    ROMDATA: start = $0000, size = $10000, type = ro, fill = yes, fillval = $FF, file = %O;
}
# RULES: core/rules.c and its data (cc65 --code-name RULES); CODE2 also
# goes in the lower half; ONCE: run-once start-up code (cc65's
# constructors); RODATA and DATA are stored in the ROM and copied to RAM.
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOWRAM:   load = LORAM, type = bss, define = yes, optional = yes;
    RULES:    load = ROMLO, type = ro, define = yes, optional = yes;
    STUBS:    load = STUBS, type = ro;
    STARTUP:  load = ROMHI, type = ro;
    ONCE:     load = ROMHI, type = ro, optional = yes;
    CODE:     load = ROMHI, type = ro;
    CODE2:    load = ROMLO, type = ro, optional = yes;
    RODATA:   load = ROMDATA, run = RAM, type = rw, define = yes;
    DATA:     load = ROMDATA, run = RAM, type = rw, define = yes;
    BSS:      load = RAM, type = bss, define = yes;
    HEADER:   load = HEADER, type = ro;
    VECTORS:  load = VECTORS, type = ro;
}
# cc65's constructor, destructor and interrupt tables (none are used)
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
# the C stack's size, for cc65's runtime
SYMBOLS {
    __STACKSIZE__: type = weak, value = $1000;
}
